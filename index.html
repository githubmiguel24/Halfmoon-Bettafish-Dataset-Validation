<style>
:root{
  color-scheme:light;
  --bg:#EEF2F9; --surface:#FFFFFF; --ink:#1E293B; --ink-2:#64748B; --line:#E2E8F0;
  --brand:#5B7FC7; --brand-ink:#1E3A8A; --brand-soft:#E0E9FB;
  --quote:#F1F6FF; --quote-line:#A9C4F5; --lav:#F5F3FF; --lav-line:#C4B5FD;
  --peach:#FFF4E8; --peach-line:#FBD3A8; --peach-ink:#9A3412;
  --err:#C2410C; --ok:#2F855A;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding:0 16px 48px}
.top{position:sticky;top:0;z-index:5;background:rgba(238,242,249,.92);backdrop-filter:blur(6px);padding:10px 0 8px;margin:0 -16px 8px;padding-inline:16px}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;font:500 12.5px var(--mono);color:var(--ink-2)}
.pbar{flex:1;height:6px;border-radius:3px;background:#D8E0EE;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.form{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
@media (max-width:520px){.card{padding:18px 16px}}
.card.head{border-top:10px solid var(--brand);padding-top:20px}
.card.sect{border-left:6px solid var(--brand)}
h1{font:700 clamp(24px,4vw,30px)/1.15 var(--display);margin:0 0 8px;text-wrap:balance}
h2{font:600 20px/1.25 var(--display);margin:0}
.muted{color:var(--ink-2)}
p{margin:0}
.req{color:var(--err)}
.q-title{font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q-sub{margin-top:4px}
.dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px #334155}
.num{font:500 12px var(--mono);color:var(--ink-2)}
code{font:12.5px var(--mono);background:#F1F5F9;padding:1px 6px;border-radius:4px;overflow-wrap:anywhere}
.ask{margin-top:14px;font-size:14px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:6px;cursor:pointer}
.opt:hover{background:#F6F8FC}
.opt input{width:18px;height:18px;accent-color:var(--brand);margin:0}
.opts.row{flex-direction:row;flex-wrap:wrap;gap:6px 18px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid #CBD5E1;padding:8px 2px;border-radius:0}
input[type=text]:focus,textarea:focus{outline:none;border-bottom:2px solid var(--brand);padding-bottom:7px}
textarea{min-height:64px;resize:vertical}
.note{margin-top:8px}
.card.invalid{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.errmsg{display:none;margin-top:10px;color:var(--err);font-size:13px}
.card.invalid .errmsg{display:block}
details.ref{margin-top:12px}
details.ref summary{cursor:pointer;font-size:13px;color:var(--brand-ink);font-weight:500;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.ref summary::before{content:"▸";transition:transform .15s}
details.ref[open] summary::before{transform:rotate(90deg)}
details.ref summary::-webkit-details-marker{display:none}
.quote{margin:8px 0 0;padding:9px 12px;border-left:3px solid var(--quote-line);background:var(--quote);border-radius:0 8px 8px 0;font-size:13.5px;font-style:italic}
.quote cite{display:block;margin-top:4px;font:normal 11.5px var(--mono);color:var(--ink-2)}
.quote ol{margin:4px 0 0;padding-left:22px;font-style:normal}
.defn{margin:8px 0 0;padding:9px 12px;border-left:3px solid var(--lav-line);background:var(--lav);border-radius:0 8px 8px 0;font-size:13.5px}
.defn b{display:none}
.chip{display:inline-block;font:600 12px var(--mono);padding:3px 10px;border-radius:999px;background:var(--peach);border:1px solid var(--peach-line);color:var(--peach-ink);margin-top:8px}
.fig{margin-top:14px;background:#E8EEF7;border-radius:10px;padding:8px;position:relative}
.fig svg{display:block;width:100%;height:auto;border-radius:6px}
#fishSvg,#lbsvg{max-height:64vh}
.figcap{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.callout{margin-top:14px;background:var(--peach);border:1px solid var(--peach-line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.lengths{margin-top:12px;padding:10px 12px;background:#F8FAFC;border:1px solid var(--line);border-radius:8px;font:12.5px/1.8 var(--mono);color:#334155;overflow-x:auto;white-space:nowrap}
.eqs{margin-top:12px;padding:12px 16px;background:#F8FAFC;border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.eqh{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:10px 0 4px}
.eqh:first-child{margin-top:0}
.eq{padding:6px 0 6px 8px}
math{font-size:1.12em;color:#0F172A}
math mtext{font-family:var(--body)}
.eqkey{margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.fx{margin-top:8px;font-size:1.05em}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
button{font:500 14px var(--body);border-radius:6px;padding:9px 18px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--brand-ink)}
button:hover{background:var(--brand-soft)}
button.primary{background:var(--brand);color:#fff}
button.primary:hover{background:#4A6DB5}
button.ghost{border-color:#CBD5E1;background:var(--surface);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kp{cursor:pointer}
.kp circle.ring{fill:none;stroke:#FFB020;opacity:0}
.kp.flag circle.ring{opacity:1}
.kp.occ circle.pt{fill-opacity:.35;stroke-dasharray:3 2}
.tip{position:absolute;pointer-events:none;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;box-shadow:0 8px 24px rgba(30,41,59,.18);transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;z-index:3}
.tip b{font-weight:600}
.fishbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font:500 12.5px var(--mono);color:var(--ink-2);margin-top:12px}
.fishbar label{display:flex;gap:6px;align-items:center;cursor:pointer;font-family:var(--body);font-size:13px}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:10px;height:10px;border-radius:50%;background:#D8E0EE;cursor:pointer}
.pips i.done{background:var(--brand)} .pips i.bad{background:#F59E0B} .pips i.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid #CBD5E1;border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;cursor:pointer;background:var(--surface)}
.chips label:has(input:checked){background:#FFF7E6;border-color:#F59E0B}
.chips input{display:none}
.chips .dot{width:12px;height:12px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.sum div{background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sum b{display:block;font:600 22px var(--display)}
.sum span{font-size:12.5px;color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
#copyBox{font:12px var(--mono);min-height:120px;border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:10px}
.status{font-size:13px;color:var(--ok)}
.fgrid{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.fcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
@media (min-width:640px){.fcard{flex-direction:row}.fimg{flex:0 0 38%}.fbody{flex:1;min-width:0}}
.fimg{background:#E8EEF7}
.fimg svg{display:block;width:100%;height:auto}
.fbody{padding:10px 12px 12px}
.ftitle{font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.fval{font:500 12px var(--mono);color:var(--ink-2)}
.feq{margin-top:8px;padding:6px 10px;background:var(--quote);border-radius:6px;overflow-x:auto}
.feq math{font-size:14px;margin:6px 0;color:#0F172A}
.feq mtext{font-family:var(--body)}
.fkey{margin-top:8px;font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.idot{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1.3px #334155;margin-right:5px;vertical-align:-1px}
.fplain{font-size:13px;margin-top:6px}
.fx{margin-top:8px;overflow-x:auto}
.fx math{font-size:16px;color:#0F172A}
.fx mtext{font-family:var(--body)}
.ex{margin-top:10px;font:13px var(--mono);color:#334155;background:#F8FAFC;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.eqline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:6px 0;font-size:14px}
.eqline .lhs{font-weight:600}
.op{font:600 15px var(--mono);color:var(--brand-ink);padding:0 2px}
.w{color:var(--ink-2);font-style:italic}
.tk{display:inline-flex;align-items:center;white-space:nowrap}
.tk .idot{margin-right:5px}
.mid{font-size:12px;margin-right:4px;color:#111}
.fr{display:inline-flex;flex-direction:column;align-items:center;text-align:center;vertical-align:middle;margin:0 2px}
.fr>span{padding:1px 6px}
.fr>span:first-child{border-bottom:1.5px solid #0F172A;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 4px}
.num2{font:600 15px var(--mono)}
.fx .eqline{font-size:15px}
.minibar{display:inline-block;width:120px;height:6px;border-radius:3px;background:#D8E0EE;overflow:hidden;vertical-align:middle;margin:0 8px}
.minibar i{display:block;height:100%;background:var(--brand)}
.linkbtn{padding:4px 8px;font-size:13px;color:var(--brand-ink);background:none;border:0}
.pips{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.bpager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.bpager input{width:64px;border:1px solid #CBD5E1;border-radius:6px;padding:3px 6px;font:inherit;text-align:center}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}
.bthumb{position:relative;padding:0;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#E8EEF7;border:1px solid var(--line)}
.bthumb:hover{background:#E8EEF7;outline:2px solid var(--brand)}
.bthumb img{width:100%;height:100%;object-fit:cover;display:block}
.bthumb.loading{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.bnum{position:absolute;left:4px;top:4px;font:500 10.5px var(--mono);background:rgba(255,255,255,.85);color:var(--ink);border-radius:4px;padding:0 4px}
.badge{position:absolute;right:4px;font:600 10px var(--mono);border-radius:4px;padding:1px 5px}
.badge.s{position:static;background:var(--brand-soft);color:var(--brand-ink)}
.bthumb .badge.s{position:absolute;top:4px}
.badge.f{bottom:4px;background:#F59E0B;color:#fff}
.badge.m{top:22px;background:#fff;color:var(--ink)}
.lb{position:fixed;inset:0;z-index:20;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.lb[hidden]{display:none}
.lbcard{background:#fff;border-radius:12px;padding:16px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto}
.lbhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function bindMethod(root){
  root.querySelectorAll(".card.q").forEach(card=>{
    const id=card.dataset.id;
    card.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",()=>{
      const m=state.method[id]||(state.method[id]={v:"",note:""}); m.v=r.value; m.at=new Date().toISOString(); persist();
      card.classList.remove("invalid");
      card.querySelector(".note").hidden = !(m.v==="disagree"||m.v==="unsure");
    }));
    const t=card.querySelector(".note input");
    t && t.addEventListener("input",e=>{ const m=state.method[id]||(state.method[id]={v:"",note:""}); m.note=e.target.value; persist(); });

    <div id="fixBox" ${r.verdict==="fix"?"":"hidden"}>
      <p class="ask">Which points look wrong?</p>
      <div class="chips" id="chips">${chips}</div>
      <div class="note"><input type="text" id="fcomment" placeholder="Comment (optional), e.g. dorsal tip should be on the center ray" value="${esc(r.comment)}"></div>
    </div>
    <p class="errmsg">Please answer for this fish before moving on</p>
  </div>`;
}
function drawFish(){
  const im=IMGS[state.fish], r=rv(im.id), svg=$("fishSvg"), u=Math.max(im.w,im.h)/620;
  svg.setAttribute("viewBox",`0 0 ${im.w} ${im.h}`); svg.innerHTML="";
  svg.appendChild(el("image",{href:im.src,x:0,y:0,width:im.w,height:im.h}));
  im.kp.forEach(([x,y,v],i)=>{ if(!v) return; const c=COLORS[i];
    const g=el("g",{class:"kp"+(v===1?" occ":"")+(r.flags.includes(i)?" flag":""),tabindex:0,role:"button","aria-label":NAME(i)});
    g.appendChild(el("circle",{class:"ring",cx:x,cy:y,r:10*u,"stroke-width":3*u}));
    g.appendChild(el("circle",{class:"pt",cx:x,cy:y,r:(hot===i?7:5)*u,fill:c,stroke:STROKE(c),"stroke-width":1.5*u}));
    g.appendChild(el("circle",{cx:x,cy:y,r:11*u,fill:"transparent"}));
    if(state.labels){ const t=el("text",{x:x+8*u,y:y-7*u,"font-size":12*u,"font-family":"IBM Plex Mono, monospace","font-weight":600,fill:"#fff",stroke:"#000","stroke-width":3.5*u,"paint-order":"stroke","pointer-events":"none"}); t.textContent=SNUM[KEYS[i]]; g.appendChild(t); }
    g.addEventListener("pointerenter",()=>showTip(i)); g.addEventListener("pointerleave",()=>showTip(-1));
    g.addEventListener("focus",()=>showTip(i)); g.addEventListener("blur",()=>showTip(-1));
    g.addEventListener("click",()=>toggleFlag(i));
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleFlag(i);} });
    svg.appendChild(g);
  });
}
function showTip(i){
  hot=i; const tip=$("tip"); if(!tip) return;
  if(i<0){ tip.hidden=true; return; }
  const im=IMGS[state.fish], [x,y,v]=im.kp[i], svg=$("fishSvg"), cr=$("fishFig").getBoundingClientRect();
  tip.innerHTML=`<b>#${SNUM[KEYS[i]]} ${NAME(i)}</b>${v===1?' <span class="muted">· hidden, estimated</span>':""}`;
  const [px,py]=svgPt(svg,im.w,im.h,x,y,$("fishFig"));
  tip.style.left=Math.min(Math.max(px,110),cr.width-110)+"px"; tip.style.top=Math.max(py,40)+"px"; tip.hidden=false;
}
function toggleFlag(i){
  const r=rv(IMGS[state.fish].id), at=r.flags.indexOf(i);
  if(at>=0) r.flags.splice(at,1); else { r.flags.push(i); r.verdict="fix"; }
  r.at=new Date().toISOString(); persist(); render();
}
function bindFish(){
  drawFish();
  const card=$("fishCard"), r=rv(IMGS[state.fish].id);
  card.querySelectorAll("input[name=fishv]").forEach(x=>x.addEventListener("change",()=>{
    r.verdict=x.value; if(x.value==="ok") r.flags=[]; r.at=new Date().toISOString(); persist(); render();
  }));
  card.querySelectorAll("#chips input").forEach(x=>x.addEventListener("change",()=>{
    const i=+x.value, at=r.flags.indexOf(i); if(x.checked&&at<0) r.flags.push(i); if(!x.checked&&at>=0) r.flags.splice(at,1); persist(); drawFish();
  }));
  const fc=$("fcomment"); fc && fc.addEventListener("input",e=>{ r.comment=e.target.value; persist(); });
  $("tLabels").addEventListener("change",e=>{ state.labels=e.target.checked; persist(); drawFish(); });
  const jo=$("jumpOpen"); jo && (jo.onclick=()=>{ state.fish=IMGS.findIndex(x=>!(state.reviews[x.id]||{}).verdict); hot=-1; persist(); render(); $("fishCard").scrollIntoView({behavior:"smooth",block:"start"}); });
}

/* ---------- results ---------- */
function csv(){
  const q = s => `"${String(s??"").replace(/"/g,'""')}"`;
  const rows = [["reviewer","experience","part","item_id","item","response","flagged_keypoints","comment","reviewed_at"]];
  METHOD.forEach(it => { const m=state.method[it.id]; if(!m||(!m.v&&!m.note)) return;
    rows.push([state.reviewer,state.experience,"1_method",it.id,it.title,m.v?({agree:"follows_ibc",disagree:"does_not_follow",unsure:"not_sure"})[m.v]:"","",m.note||"",m.at||""]); });
  if ((state.overall||"").trim()) rows.push([state.reviewer,state.experience,"1_method","overall","Overall comments","","",state.overall,""]);
  IMGS.forEach(im => { const r=state.reviews[im.id]; if(!r||!r.verdict) return;
    rows.push([state.reviewer,state.experience,"2_image",im.id,im.name,r.verdict==="ok"?"correct":"needs_fix",r.flags.map(i=>KEYS[i]).join("; "),r.comment,r.at||""]); });
  Object.entries(state.browse||{}).sort((a,b)=>a[0]-b[0]).forEach(([id,b]) => { if(!b.flag&&!(b.comment||"").trim()) return;
    rows.push([state.reviewer,state.experience,"3_browse",id,b.name||"",b.flag?"flagged":"comment_only","",b.comment||"",b.at||""]); });
  return rows.map(r=>r.map(q).join(",")).join("\n");
}
let dl=null;
(async () => { try { dl = await window.claude?.use?.("downloads"); } catch(e){ dl=null; } const b=$("saveCsv"); if (dl && b) b.hidden=false; })();


/* ---------- optional: browse the full dataset ---------- */
const BR = {per:48, chunk:200, cache:{}, open:-1};
state.browse = state.browse || {};
function getChunk(n){
  if(!BR.cache[n]) BR.cache[n] = fetch(`all/${n}.json`).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).catch(e=>{ delete BR.cache[n]; throw e; });
  return BR.cache[n];
}
async function getItem(idx){ const c=await getChunk(Math.floor(idx/BR.chunk)); return c[idx%BR.chunk]; }
function renderBrowse(){
  const N=DATA.allCount, pages=Math.ceil(N/BR.per), pg=Math.min(state.bpage||0,pages-1);
  $("ptxt").textContent="Optional: browse the dataset"; $("pbar").style.width="100%";
  const nFlag=Object.values(state.browse).filter(b=>b.flag).length;
  $("form").innerHTML = header()+`<div class="card sect"><h2>Browse all ${N.toLocaleString()} images</h2>
    <p class="muted" style="margin-top:6px">Optional and quick: scroll through, and open any image to see its keypoints. If one looks wrong, flag it. <span class="badge s">10%</span> marks the fish you already checked in Section 5.</p>
    <p style="margin-top:8px;font-size:14px">Flagged so far: <b id="nflag">${nFlag}</b></p></div>
    <div class="card"><div class="bpager"><button class="ghost" id="bprev" ${pg===0?"disabled":""}>‹ Prev</button><span>Page <input type="number" id="bpg" min="1" max="${pages}" value="${pg+1}"> of ${pages} · images ${pg*BR.per+1}–${Math.min(N,(pg+1)*BR.per)}</span><button class="ghost" id="bnext" ${pg>=pages-1?"disabled":""}>Next ›</button></div>
    <div class="bgrid" id="bgrid">${Array.from({length:Math.min(BR.per,N-pg*BR.per)},(_,k)=>`<button class="bthumb loading" data-idx="${pg*BR.per+k}"><span class="bnum">${pg*BR.per+k+1}</span></button>`).join("")}</div>
    <p class="muted" id="bmsg" style="font-size:13px;margin-top:8px"></p></div>
    <div class="nav"><button class="ghost" id="bback">Back to submit</button><span></span></div>
    <div class="lb" id="lb" hidden></div>`;
  $("bback").onclick=()=>{ state.browsing=false; persist(); render(); window.scrollTo({top:0}); };
  const setPg=v=>{ state.bpage=Math.max(0,Math.min(pages-1,v)); persist(); renderBrowse(); $("bgrid").scrollIntoView({block:"start"}); };
  $("bprev").onclick=()=>setPg(pg-1); $("bnext").onclick=()=>setPg(pg+1);
  $("bpg").onchange=e=>setPg((+e.target.value||1)-1);
  document.querySelectorAll(".bthumb").forEach(b=>{
    const idx=+b.dataset.idx;
    getItem(idx).then(it=>{ const f=state.browse[it.id];
      b.classList.remove("loading");
      b.innerHTML=`<img alt="" loading="lazy" src="${it.src}"><span class="bnum">${idx+1}</span>${it.s?'<span class="badge s">10%</span>':""}${f&&f.flag?'<span class="badge f">Flagged</span>':""}${it.fish.length>1?`<span class="badge m">${it.fish.length} fish</span>`:""}`;
      b.setAttribute("aria-label",`Image ${idx+1}: ${it.name}`);
    }).catch(()=>{ $("bmsg").textContent="Some images couldn't load. Check your connection and reopen this page."; });
    b.onclick=()=>openLB(idx);
  });
}
function openLB(idx){
  BR.open=idx; const lb=$("lb"); lb.hidden=false; lb.innerHTML=`<div class="lbcard"><p class="muted">Loading…</p></div>`;
  getItem(idx).then(it=>{
    if(BR.open!==idx) return;
    const f=state.browse[it.id]||{}, N=DATA.allCount;
    lb.innerHTML=`<div class="lbcard" role="dialog" aria-modal="true" aria-label="Image ${idx+1}">
      <div class="lbhead"><span class="num">Image ${idx+1} of ${N.toLocaleString()} · ${esc(it.name)}${it.s?' · in the 10% sample':""}</span><button class="linkbtn" id="lbx" aria-label="Close">✕ Close</button></div>
      <div class="fig" id="lbfig" style="margin-top:8px"><svg id="lbsvg"></svg><div class="tip" id="lbtip" hidden></div></div>
      <label class="opt" style="margin-top:8px"><input type="checkbox" id="lbflag" ${f.flag?"checked":""}> Something looks wrong on this image</label>
      <div class="note" ${f.flag?"":"hidden"} id="lbnote"><input type="text" id="lbcom" placeholder="What looks wrong? (optional)" value="${esc(f.comment)}"></div>
      <div class="nav" style="margin-top:10px"><button class="ghost" id="lbp" ${idx===0?"disabled":""}>‹ Previous</button><button class="ghost" id="lbn" ${idx>=N-1?"disabled":""}>Next ›</button></div></div>`;
    const svg=$("lbsvg"), u=Math.max(it.w,it.h)/620;
    svg.setAttribute("viewBox",`0 0 ${it.w} ${it.h}`);
    svg.appendChild(el("image",{href:it.src,x:0,y:0,width:it.w,height:it.h}));
    it.fish.forEach(kp=>kp.forEach(([x,y,v],i)=>{ if(!v) return; const c=COLORS[i];
      const g=el("g",{class:"kp"+(v===1?" occ":"")});
      g.appendChild(el("circle",{class:"pt",cx:x,cy:y,r:5*u,fill:c,stroke:STROKE(c),"stroke-width":1.5*u}));
      g.appendChild(el("circle",{cx:x,cy:y,r:10*u,fill:"transparent"}));
      g.addEventListener("pointerenter",()=>{ const tip=$("lbtip"), cr=$("lbfig").getBoundingClientRect(), [qx,qy]=svgPt(svg,it.w,it.h,x,y,$("lbfig"));
        tip.innerHTML=`<b>#${SNUM[KEYS[i]]} ${NAME(i)}</b>${v===1?' <span class="muted">· hidden, estimated</span>':""}`;
        tip.style.left=Math.min(Math.max(qx,110),cr.width-110)+"px"; tip.style.top=Math.max(qy,40)+"px"; tip.hidden=false; });
      g.addEventListener("pointerleave",()=>{ $("lbtip").hidden=true; });
      svg.appendChild(g); }));
    const save=()=>{ const b=state.browse[it.id]||(state.browse[it.id]={}); b.name=it.name; b.at=new Date().toISOString(); persist();
      $("nflag").textContent=Object.values(state.browse).filter(x=>x.flag).length;
      const th=document.querySelector(`.bthumb[data-idx="${idx}"]`); if(th){ th.querySelector(".badge.f")?.remove(); if(b.flag) th.insertAdjacentHTML("beforeend",'<span class="badge f">Flagged</span>'); } };
    $("lbflag").onchange=e=>{ const b=state.browse[it.id]||(state.browse[it.id]={}); b.flag=e.target.checked; $("lbnote").hidden=!b.flag; save(); };
    $("lbcom").oninput=e=>{ const b=state.browse[it.id]||(state.browse[it.id]={}); b.comment=e.target.value; save(); };
    $("lbx").onclick=closeLB; $("lbp").onclick=()=>stepLB(-1); $("lbn").onclick=()=>stepLB(1);
    $("lbx").focus();
  }).catch(()=>{ lb.innerHTML=`<div class="lbcard"><p>Couldn't load this image. <button class="linkbtn" id="lbx">Close</button></p></div>`; $("lbx").onclick=closeLB; });
}
function closeLB(){ BR.open=-1; const lb=$("lb"); if(lb){ lb.hidden=true; lb.innerHTML=""; } }
function stepLB(d){ const n=BR.open+d; if(n<0||n>=DATA.allCount) return;
  const pg=Math.floor(n/BR.per); if(pg!==(state.bpage||0)){ state.bpage=pg; persist(); renderBrowse(); } openLB(n); }
document.addEventListener("keydown",e=>{ if(BR.open<0) return;
  if(e.key==="Escape"){ closeLB(); return; }
  if(e.target.matches("input,textarea")) return;
  if(e.key==="ArrowRight") stepLB(1); if(e.key==="ArrowLeft") stepLB(-1); });
document.addEventListener("click",e=>{ if(e.target.id==="lb") closeLB(); });

/* ---------- page rendering ---------- */
function render(){
  if(state.browsing && state.page===PAGES.length-1) return renderBrowse();
  state.browsing=false;
  const pi=state.page, p=PAGES[pi], root=$("form");
  const total=PAGES.length-1;
  $("ptxt").textContent = pi===0 ? "Start" : pi===total ? "Last step" : `Section ${pi} of ${total-1}`;
  $("pbar").style.width = (100*pi/total)+"%";
  let h = header();
  if(p.kind==="intro"){
    h += `<div class="card">
      <p>Thank you for helping validate our thesis dataset. It takes about <b>an hour</b> in total, and you can stop at any point and continue later.</p>
      <ol style="margin:10px 0 0;padding-left:20px">
        <li><b>Sections 1–4:</b> read how each keypoint and criterion is defined, and tell us if it follows IBC Book 1.</li>
        <li><b>Section 5:</b> look at ${IMGS.length} annotated fish (a random 10% of our ${DATA.allCount.toLocaleString()} images) and tell us if the points are in the right place.</li>
        <li><b>Last step:</b> download your answers and send them to us. If you like, you can also skim the full dataset there.</li>
      </ol>
      <p class="muted" style="margin-top:10px;font-size:13.5px">Your answers are saved in this browser as you go, so you can close the page and come back.</p>
    </div>
    <div class="card q" data-req="name"><div class="q-title">Your name<span class="req">*</span></div>
      <input type="text" id="rname" placeholder="Your answer" value="${esc(state.reviewer)}" autocomplete="name" style="margin-top:8px">
      <p class="errmsg">This is a required question</p></div>
    <div class="card"><div class="q-title">Your experience with bettas (optional)</div>
      <input type="text" id="rexp" placeholder="e.g. breeder for 8 years, IBC judge" value="${esc(state.experience)}" style="margin-top:8px"></div>`;
  } else if(p.kind==="lm"){
    p.fig = refFigure(p.keys);
    h += sectHead(p,pi);
    h += METHOD.filter(it=>it.kind==="landmark"&&p.keys.includes(it.key)).sort((a,b)=>p.keys.indexOf(a.key)-p.keys.indexOf(b.key)).map(methodCard).join("");
    if(p.note) h += `<div class="callout"><b>Why two base corners?</b> Book 1 measures fins from the base of the center fin ray. We mark the front and rear corners of the fin base, and the system uses their midpoint as the base of the center ray.</div>`;
  } else if(p.kind==="crit"){
    p.desc = "Each criterion compares fin lengths with each other or with the body. First, here is how each length is measured on a real fish from the dataset.";
    p.fig = formulaCards();
    h += sectHead(p,pi) + METHOD.filter(it=>it.kind!=="landmark").map(methodCard).join("");
  } else if(p.kind==="fish"){
    p.desc = "Now check the actual annotations. Points marked with a dashed outline were hidden in the photo, so their position was estimated.";
    h += sectHead(p,pi) + fishCard();
  } else {
    const ms=Object.values(state.method).filter(m=>m.v), c=v=>ms.filter(m=>m.v===v).length;
    const nBrowse=Object.values(state.browse||{}).filter(b=>b.flag).length;
    const fishDone=IMGS.filter(im=>(state.reviews[im.id]||{}).verdict), fixN=fishDone.filter(im=>state.reviews[im.id].verdict==="fix").length;
    h += `<div class="card sect"><h2>Almost done</h2><p class="muted" style="margin-top:6px">Add any final comments, then download your answers and send the file to the research team by email or chat.</p>
      <div class="sum"><div><b>${c("agree")}/${METHOD.length}</b><span>definitions follow IBC</span></div><div><b>${c("disagree")+c("unsure")}</b><span>marked "No" or "Not sure"</span></div><div><b>${fishDone.length}/${IMGS.length}</b><span>fish checked (${fixN} need fixing)</span></div></div></div>
    <div class="card"><div class="q-title">Any other comments on the method? (optional)</div>
      <textarea id="overall" placeholder="Your answer">${esc(state.overall)}</textarea></div>
    <div class="card"><div class="q-title">Optional: skim the whole dataset</div>
      <p class="muted" style="margin-top:4px;font-size:14px">Browse all ${DATA.allCount.toLocaleString()} annotated images. There are no required questions — if something looks wrong, flag it and it will be included in your responses.${nBrowse?` You have flagged <b>${nBrowse}</b> so far.`:""}</p>
      <div class="actions"><button class="ghost" id="toBrowse">Browse all images</button></div></div>
    <div class="card"><div class="q-title">Send your responses</div>
      <div class="actions"><button class="primary" id="saveCsv" ${dl?"":"hidden"}>Download responses (CSV)</button><button class="ghost" id="copyRes">Copy responses</button><span class="status" id="resMsg" role="status"></span></div>
      <textarea id="copyBox" readonly hidden></textarea></div>`;
  }
  // nav
  const isFish=p.kind==="fish", last=pi===PAGES.length-1;
  let back = pi>0 ? `<button class="ghost" id="back">Back</button>` : `<span></span>`;
  let next = last ? "" : `<button class="primary" id="next">${pi===0?"Start":isFish&&state.fish<IMGS.length-1?"Next fish":"Next"}</button>`;
  if(isFish && state.fish>0) back = `<button class="ghost" id="back">Previous fish</button>`;
  h += `<div class="nav">${back}${next}</div>`;
  root.innerHTML = h;
  bindPage(p);
}
function validate(p){
  let firstBad=null;
  if(p.kind==="intro"){ const c=document.querySelector('[data-req="name"]'); if(!state.reviewer.trim()){ c.classList.add("invalid"); firstBad=c; } }
  if(p.kind==="lm"||p.kind==="crit"){ document.querySelectorAll(".card.q").forEach(c=>{ if(!(state.method[c.dataset.id]||{}).v){ c.classList.add("invalid"); firstBad=firstBad||c; } }); }
  if(p.kind==="fish"){ const c=$("fishCard"); if(!rv(IMGS[state.fish].id).verdict){ c.classList.add("invalid"); firstBad=c; } }
  if(firstBad){ firstBad.scrollIntoView({behavior:"smooth",block:"center"}); return false; }
  return true;
}
function go(page){ state.page=page; persist(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function bindPage(p){
  if(p.kind==="intro"){
    $("rname").addEventListener("input",e=>{ state.reviewer=e.target.value; persist(); e.target.closest(".card").classList.remove("invalid"); });
    $("rexp").addEventListener("input",e=>{ state.experience=e.target.value; persist(); });
  }
  if(p.kind==="lm"||p.kind==="crit") bindMethod($("form"));
  if(p.kind==="fish") bindFish();
  if(p.kind==="done"){
    $("overall").addEventListener("input",e=>{ state.overall=e.target.value; persist(); });
    $("toBrowse").onclick=()=>{ state.browsing=true; persist(); render(); window.scrollTo({top:0}); };
    $("copyRes").onclick = async () => {
      const text=csv();
      try { await navigator.clipboard.writeText(text); $("resMsg").textContent="Copied. Paste it into an email or chat to the research team."; $("copyBox").hidden=true; }
      catch(e){ const b=$("copyBox"); b.value=text; b.hidden=false; b.focus(); b.select(); $("resMsg").textContent="Select the text below and copy it."; }
    };
    $("saveCsv").onclick = async () => {
      const name=(state.reviewer.trim()||"validator").replace(/[^\w-]+/g,"_");
      try { await dl.save({filename:`betta_validation_${name}.csv`, data:csv()}); $("resMsg").textContent="Downloaded. Please send the file to the research team. Thank you!"; }
      catch(e){ $("resMsg").textContent = e && e.code==="declined" ? "Download cancelled." : "Could not download. Use Copy responses instead."; }
    };
  }
  const nx=$("next"), bk=$("back");
  nx && (nx.onclick=()=>{
    if(!validate(p)) return;
    if(p.kind==="fish" && state.fish<IMGS.length-1){ state.fish++; hot=-1; persist(); render(); $("fishCard").scrollIntoView({behavior:"smooth",block:"start"}); return; }
    go(state.page+1);
  });
  bk && (bk.onclick=()=>{
    if(p.kind==="fish" && state.fish>0){ state.fish--; hot=-1; persist(); render(); $("fishCard").scrollIntoView({behavior:"smooth",block:"start"}); return; }
    go(state.page-1);
  });
}
if(state.page>=PAGES.length) state.page=0;
render();
window.addEventListener("resize",()=>hot>=0&&showTip(hot));
</script>

</body></html>
